version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify app env sets NODE_ENV=production; keep install of build/dev deps.
        - NPM_CONFIG_PRODUCTION=false NODE_ENV=development npm install --include=dev --no-audit --no-fund
    build:
      commands:
        # Persist Amplify console env vars into Next.js runtime (.env.production).
        - |
          {
            echo "DYNAMODB_TABLE_NAME=${DYNAMODB_TABLE_NAME:-csrd-data}"
            echo "DYNAMODB_REGION=${DYNAMODB_REGION:-ap-south-1}"
          } > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
