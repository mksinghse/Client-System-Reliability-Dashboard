version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify app env sets NODE_ENV=production; keep install of build/dev deps.
        - NPM_CONFIG_PRODUCTION=false NODE_ENV=development npm install --include=dev --no-audit --no-fund
    build:
      commands:
        - npm run build
  artifacts:
    # Next.js SSR on Amplify Hosting expects the app root (includes .next + package files)
    baseDirectory: .
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
